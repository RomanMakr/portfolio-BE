services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portfolio_marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - portfolio_pgdata:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio_marketplace"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  portfolio_pgdata:
